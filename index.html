const HK="meme_hist_v1";
function lh(){try{return JSON.parse(localStorage.getItem(HK)||"{}")}catch{return{}}}
function sh(h){try{localStorage.setItem(HK,JSON.stringify(h))}catch{}}
function updStat(){document.getElementById("stat").textContent="оценено: "+Object.keys(lh()).length}
function hf(file){
  /* Синхронный хэш — не рвёт цепочку жеста, video.play() работает */
  const s=file.name+'|'+file.size+'|'+file.lastModified;
  let h=5381;for(let i=0;i<s.length;i++)h=Math.imul(h,33)^s.charCodeAt(i);
  return (h>>>0).toString(16)+'_'+file.size.toString(36)
}
function pick(){
  const rs=CFG.reactions,t=rs.reduce((s,r)=>s+r.chance,0);
  if(!t)return rs[0];
  let x=Math.random()*t;
  for(const r of rs){x-=r.chance;if(x<=0)return r}
  return rs[rs.length-1]
}
let locked=false,cdt=null,fxt=null,pdur=null;
async function evaluate(file){
  if(locked)return;
  const hash=await hf(file),hist=lh();
  let r=null;
  if(hist[hash]){
    r=CFG.reactions.find(x=>x.id===hist[hash])||null;
    if(r&&r.kind!=="normal")r=null;
  }
  if(!r){
    r=pick();
    if(r.kind==="normal"){hist[hash]=r.id;sh(hist)}
  }
  showR(r)
}
function showR(r){
  document.getElementById("welcome").classList.remove("on");
  document.getElementById("reaction").classList.add("on");
  const vid=document.getElementById("vid");
  const tmr=document.getElementById("timer");
  const dsc=document.getElementById("desc");
  const btn=document.getElementById("next-btn");
  tmr.textContent=""; btn.style.display="none";
  vid.style.display="none"; vid.src=""; vid.onended=null;
  if(r.kind==="effect"){
    dsc.textContent=""; dsc.style.opacity="0"; dsc.style.animation="none";
    pdur=null;
  } else {
    dsc.textContent=r.desc||""; dsc.style.opacity="1"; dsc.style.animation="none";
    pdur=r.kind==="special"?Math.max(1,r.duration||5):null;
    if(r.kind==="normal")btn.style.display="";
  }
  if(r.video){
    vid.style.display="block"; /* ИСПРАВЛЕНО: было "" — откатывалось к CSS display:none */
    vid.src=r.video; vid.loop=false;
    vid.onended=()=>{
      if(r.kind==="special"&&pdur)startCD(pdur);
      else if(r.kind==="effect")playFX(dsc,r.effect,r.desc);
    };
    vid.play().catch(()=>{});
  } else {
    if(r.kind==="special")startCD(pdur);
    else if(r.kind==="effect")playFX(dsc,r.effect,r.desc);
  }
}
function startCD(sec){
  clearInterval(cdt);locked=true;
  let l=sec;
  document.getElementById("timer").textContent=l;
  cdt=setInterval(()=>{
    l--;
    if(l<=0){clearInterval(cdt);locked=false;
      document.getElementById("timer").textContent="";
      document.getElementById("next-btn").style.display="";
    }else{document.getElementById("timer").textContent=l}
  },1000)
}
function showBtn(){document.getElementById("next-btn").style.display=""}
function playFX(el,type,text){
  clearTimeout(fxt);clearInterval(fxt);
  locked=true;
  el.style.animation="none"; el.style.color=""; el.style.textShadow="";
  el.textContent=""; el.style.opacity="1";
  switch(type){
    case"typewriter":fxTypewriter(el,text);break;
    case"glitch":fxGlitch(el,text);break;
    case"rainbow":fxRainbow(el,text);break;
    case"zoom":fxZoom(el,text);break;
    case"matrix":fxMatrix(el,text);break;
    case"shake":fxShake(el,text);break;
    case"neon":fxNeon(el,text);break;
    default:el.textContent=text;locked=false;showBtn();
  }
}
function fxTypewriter(el,text){
  let i=0,d=Math.min(80,Math.max(25,3000/text.length));
  const t=setInterval(()=>{
    el.textContent+=text[i++];
    if(i>=text.length){clearInterval(t);locked=false;fxt=setTimeout(showBtn,500)}
  },d)
}
function fxGlitch(el,text){
  el.textContent=text;
  el.style.animation="fx-glitch 0.22s infinite";
  fxt=setTimeout(()=>{el.style.animation="none";locked=false;showBtn()},2500)
}
function fxRainbow(el,text){
  el.textContent=text;
  el.style.animation="fx-rainbow 0.5s linear infinite";
  fxt=setTimeout(()=>{el.style.animation="none";el.style.color="";locked=false;showBtn()},3000)
}
function fxZoom(el,text){
  el.textContent=text;
  el.style.animation="fx-zoom 0.7s cubic-bezier(0.175,0.885,0.32,1.275) forwards";
  fxt=setTimeout(()=>{locked=false;showBtn()},1500)
}
function fxMatrix(el,text){
  const ch="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*";
  let iter=0,steps=text.length*5;
  const t=setInterval(()=>{
    el.textContent=[...text].map((c,i)=>i<iter/5?c:ch[Math.floor(Math.random()*ch.length)]).join("");
    if(++iter>steps){clearInterval(t);el.textContent=text;locked=false;fxt=setTimeout(showBtn,400)}
  },35)
}
function fxShake(el,text){
  el.textContent=text;
  el.style.animation="fx-shake 0.4s ease infinite";
  fxt=setTimeout(()=>{el.style.animation="none";locked=false;showBtn()},2200)
}
function fxNeon(el,text){
  el.textContent=text;
  el.style.animation="fx-neon 0.7s ease-in-out infinite";
  fxt=setTimeout(()=>{el.style.animation="none";el.style.textShadow="";locked=false;showBtn()},3500)
}
function showW(){
  clearInterval(cdt);clearTimeout(fxt);clearInterval(fxt);
  locked=false;pdur=null;
  const vid=document.getElementById("vid"),dsc=document.getElementById("desc");
  vid.pause();vid.src="";vid.style.display="none";
  dsc.style.animation="none";dsc.style.color="";dsc.style.textShadow="";
  document.getElementById("timer").textContent="";
  document.getElementById("next-btn").style.display="none";
  document.getElementById("reaction").classList.remove("on");
  document.getElementById("welcome").classList.add("on");
  updStat()
}
const dz=document.getElementById("dz"),fi=document.getElementById("fi");
dz.addEventListener("click",()=>fi.click());
fi.addEventListener("change",e=>{if(e.target.files[0])evaluate(e.target.files[0]);fi.value=""});
dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("drag")});
dz.addEventListener("dragleave",()=>dz.classList.remove("drag"));
dz.addEventListener("drop",e=>{
  e.preventDefault();dz.classList.remove("drag");
  const f=e.dataTransfer.files[0];if(f&&!locked)evaluate(f)
});
document.getElementById("next-btn").addEventListener("click",showW);
updStat();
</script>
</body>
</html>
